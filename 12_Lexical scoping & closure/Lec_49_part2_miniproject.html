<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBGC Changeer</title>
</head>
<body style="background-color: blanchedalmond;">
    <button id="Orange">Orange</button>
    <button id="Green">Green</button>
    <script>
    //   document.getElementById('Orange').onclick=function(){
    //      document.body.style.backgroundColor=`orange`
    //   };
    //    document.getElementById('Green').onclick=function(){
    //      document.body.style.backgroundColor=`green`
    //   };

    //we cant handl many colors at a time so we make a func
    function clickHandler(color){
        //here due to this directly the func get executed on calling
        //so e need to wrap this in function
        //it will use conceppt of lexical scopping

        //document.body.style.backgroundColor=`${color}`
       return function (){
            document.body.style.backgroundColor=`${color}`
        }
      
    }
    //we need to have referencce of       to do work
    document.getElementById('Orange').onclick=clickHandler("orange")
     document.getElementById('Green').onclick=clickHandler("green")
    </script>
</body>
</html>
