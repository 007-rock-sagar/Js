<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Late night </title>
</head>
<body style="background-color:#212121; color:aliceblue">
</body>
<script>
    //*****task creating a div element and attach to document**** 
   const div= document.createElement('div')
   console.log(div)
   div.className="main"
   div.id=Math.round(Math.random() *10 +1)
   //the id,classname are inbuilt attributes 
   //we can createw our own custom attributes
   div.setAttribute("Title","generated_title")
   div.style.backgroundColor="green"
   div.style.padding="12px"
   //the div created along with its attributes are created in memory so it  is not pspesring in page right now
   //so now we will attach these in web page
   //1.we can directly atttach using innertext
   //e.g div.innerText="Late Night Triggger"
   //2.we can do it custom way
   const addtext=document.createTextNode("Late Night Trigger")
   div.appendChild(addtext)
   //now attach
   document.body.appendChild(div)
</script>
</html>
